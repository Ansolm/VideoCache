apply from: './../config.gradle'
apply plugin: 'com.android.library'

android {

    publishing {

        singleVariant('release')

    }

    namespace 'com.ansolm.videocache'
    compileSdk = 37

    defaultConfig {
        minSdk = 21
        targetSdk = 37
        versionCode buidConfig.versionCode
        versionName buidConfig.versionName
        // AGP 9 no longer emits VERSION_NAME into library BuildConfig
        buildConfigField "String", "VERSION_NAME", "\"${buidConfig.versionName}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    api dependent.slf4j
}

apply plugin: 'maven-publish'

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                groupId = 'com.github.ansolm'
                artifactId = 'videocache'
                version = '0.0.11'
                from components.release
            }
        }
    }
}
